[project]
  authors = [
    { name = "Sasan Jacob Rasti", email = "sasan_jacob.rasti@tu-dresden.de" },

    { name = "Felix Flatter", email = "felix.flatter@rptu.de" },
    { name = "Guntram Pressmair" },
    { name = "Jörg Dickert" },
  ]
  dependencies = [
    "attrs>=24.2.0",
    "cattrs>=23.2.3",
    "loguru>=0.7.2",
    "numpy>=2.0.1",
    "pandas>=2.2.2",
    "pvlib>=0.11.0",
    "pyochain>=0.28.0",
    "pyarrow>=17.0.0",
    "windpowerlib>=0.2.2",
  ]
  description = "A toolbox to create multi-energy power time series for different technologies in steady-state simulations of energy systems."
  license = { file = "LICENSE" }
  name = "pyramecium-technology-models"
  readme = { file = "README.md", content-type = "text/markdown" }
  requires-python = ">=3.13"
  version = "1.1.0"

  [project.optional-dependencies]
    all = ["pyramecium-technology-models[cli,geo,mastr,weather]"]
    cli = ["click>=8.1.7", "openpyxl>=3.1.5", "pyramecium-technology-models[geo,weather]"]
    geo = [
      "aiohttp>=3.10.2",
      "geopandas>=1.0.1",
      "pyproj>=3.6.1",
      "rasterio>=1.3.10",
      "scipy>=1.14.0",
      "shapely>=2.0.5",
    ]
    mastr = ["lxml>=4.9.2", "open-mastr>=0.14.4"]
    weather = ["aiohttp>=3.10.2", "netCDF4>=1.7.3", "pyproj>=3.6.1", "requests>=2.32.3"]

  [project.urls]
    homepage = "https://github.com/sasanjac/pyramecium-technology-models"

  [project.scripts]
    convert-clc-europe-file   = "pstm.cli.convert_clc_europe_file:ClcEuropeFile.convert"
    convert-dwd-try-files     = "pstm.cli.convert_dwd_try_files:DwdTryFiles.convert"
    convert-time-zones-file   = "pstm.cli.convert_time_zones_file:TimeZonesFile.convert"
    convert-zip-codes-file    = "pstm.cli.convert_zip_codes_file:ZipCodesFile.convert"
    create-dickert-households = "pstm.cli.create_dickert_households:DickertHouseholds.create"
    create-dwd-try-index-file = "pstm.cli.create_dwd_try_index_file:DwdTryIndexFile.create"

[build-system]
  build-backend = "hatchling.build"
  requires      = ["hatchling"]

[dependency-groups]
  dev = [
    "commitizen>=3.28.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.1.post1",
    "mypy>=1.11.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.1",
    "ruff>=0.5.5",
    "types-requests>=2.32.0.20240712",
  ]

[tool.hatch.build.targets.wheel]
  packages = ["src/pstm"]

[tool.ruff]
  exclude     = ["*.ipynb"]
  line-length = 120

  [tool.ruff.lint]
    ignore = [
      "ANN002",
      "ANN003",
      "C901",
      "COM812",
      "D100",
      "D101",
      "D102",
      "D103",
      "D104",
      "D105",
      "D106",
      "D107",
      "D202",
      "D203",
      "D401",
      "E402",
      "E501",
    ]
    select = ["ALL"]

    [tool.ruff.lint.flake8-type-checking]
      runtime-evaluated-decorators = ["attrs.define"]

    [tool.ruff.lint.isort]
      force-single-line = true

    [tool.ruff.lint.pydocstyle]
      convention = "pep257"

    [tool.ruff.lint.pep8-naming]
      classmethod-decorators = ["classmethod"]

    [tool.ruff.lint.pylint]
      max-args = 10

    [tool.ruff.lint.per-file-ignores]
      "tests/*" = ["ANN001", "ANN201", "INP001", "PLR2004", "S101"]

    [tool.ruff.lint.flake8-import-conventions.extend-aliases]
      "collections.abc"  = "cabc"
      "datetime"         = "dt"
      "geopandas"        = "gpd"
      "numpy.typing"     = "npt"
      "rasterio"         = "rio"
      "shapely.geometry" = "shg"
      "typing"           = "t"

[tool.commitizen]
  name          = "cz_conventional_commits"
  tag_format    = "$version"
  version       = "1.1.0"
  version_files = ["pyproject.toml:version", "src/pstm/__version__.py:VERSION"]

[tool.mypy]
  enable_incomplete_feature = "NewGenericSyntax"
  follow_imports            = "normal"
  ignore_missing_imports    = true
  mypy_path                 = "src/pstm"
  namespace_packages        = true
  strict_optional           = true
  warn_no_return            = true
  warn_redundant_casts      = true
  warn_unused_ignores       = true

[tool.pytest.ini_options]
  python_files = "test_*.py"
  testpaths    = ["tests"]

[tool.coverage.run]
  branch = true
  omit   = ["__pypackages__/*", "build/*", "tests/*"]
  source = ["src/pstm"]

[tool.coverage.report]
  show_missing = true

[tool.coverage.xml]
  output = "coverage.xml"

[tool.pyright]
  exclude          = ["**/__pycache__"]
  typeCheckingMode = "off"
