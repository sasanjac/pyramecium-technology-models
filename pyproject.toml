[project]
  authors = [
    { name = "Sasan Jacob Rasti", email = "sasan_jacob.rasti@tu-dresden.de" },

    { name = "Felix Flatter", email = "felix.flatter@rptu.de" },
    { name = "Guntram Pressmair" },
    { name = "Jörg Dickert" },
  ]
  dependencies = [
    "attrs>=24.2.0",
    "cattrs>=23.2.3",
    "loguru>=0.7.2",
    "numpy>=2.0.1",
    "pandas>=2.2.2",
    "pvlib>=0.11.0",
    "pyochain>=0.28.0",
    "pyarrow>=17.0.0",
    "windpowerlib>=0.2.2",
  ]
  description = "A toolbox to create multi-energy power time series for different technologies in steady-state simulations of energy systems."
  license = { file = "LICENSE" }
  name = "pyramecium-technology-models"
  readme = { file = "README.md", content-type = "text/markdown" }
  requires-python = ">=3.13,<3.14"
  version = "1.1.0"

  [project.optional-dependencies]
    all = ["pyramecium-technology-models[cli,geo,mastr,weather]"]
    cli = ["click>=8.1.7", "openpyxl>=3.1.5", "pyramecium-technology-models[geo,weather]"]
    geo = [
      "aiohttp>=3.10.2",
      "geopandas>=1.0.1",
      "pyproj>=3.6.1",
      "rasterio>=1.3.10",
      "scipy>=1.14.0",
      "shapely>=2.0.5",
    ]
    mastr = ["lxml>=4.9.2", "open-mastr>=0.14.4"]
    weather = ["aiohttp>=3.10.2", "netCDF4>=1.7.3", "pyproj>=3.6.1", "requests>=2.32.3"]

  [project.urls]
    homepage = "https://github.com/sasanjac/pyramecium-technology-models"

  [project.scripts]
    convert-clc-europe-file   = "pstm.cli.convert_clc_europe_file:ClcEuropeFile.convert"
    convert-dwd-try-files     = "pstm.cli.convert_dwd_try_files:DwdTryFiles.convert"
    convert-time-zones-file   = "pstm.cli.convert_time_zones_file:TimeZonesFile.convert"
    convert-zip-codes-file    = "pstm.cli.convert_zip_codes_file:ZipCodesFile.convert"
    create-dickert-households = "pstm.cli.create_dickert_households:DickertHouseholds.create"
    create-dwd-try-index-file = "pstm.cli.create_dwd_try_index_file:DwdTryIndexFile.create"

[build-system]
  build-backend = "hatchling.build"
  requires      = ["hatchling"]

[dependency-groups]
  dev = [
    "commitizen>=4.18.0",
    "deptry>=0.23.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.1.post1",
    "poethepoet>=0.48.0",
    "pyrefly>=1.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.1",
    "ruff>=0.16.0",
    "types-requests>=2.32.0.20240712",
  ]

[tool.hatch.build.targets.wheel]
  packages = ["src/pstm"]

[tool.ruff]
  exclude     = ["*.ipynb"]
  line-length = 120

  [tool.ruff.format]
    indent-style              = "space"
    line-ending               = "auto"
    preview                   = true
    quote-style               = "double"
    skip-magic-trailing-comma = false

  [tool.ruff.lint]
    ignore = [
      "blank-line-after-function",
      "complex-structure",
      "incorrect-blank-line-before-class",
      "line-contains-todo",
      "line-too-long",
      "missing-trailing-comma",
      "missing-type-args",
      "missing-type-kwargs",
      "module-import-not-at-top-of-file",
      "non-empty-init-module",
      "non-imperative-mood",
      "undocumented-magic-method",
      "undocumented-public-class",
      "undocumented-public-function",
      "undocumented-public-init",
      "undocumented-public-method",
      "undocumented-public-module",
      "undocumented-public-nested-class",
      "undocumented-public-package",
    ]
    preview = true
    select  = ["ALL"]

    [tool.ruff.lint.flake8-annotations]
      allow-star-arg-any = true

    [tool.ruff.lint.flake8-type-checking]
      runtime-evaluated-decorators = ["attrs.define"]
      strict                       = true

    [tool.ruff.lint.isort]
      force-single-line          = true
      force-sort-within-sections = true

    [tool.ruff.lint.pydocstyle]
      convention = "google"

    [tool.ruff.lint.pep8-naming]
      classmethod-decorators = ["classmethod"]

    [tool.ruff.lint.pylint]
      max-args           = 10
      max-public-methods = 30
      max-returns        = 10

    [tool.ruff.lint.per-file-ignores]
      "tests/*" = [
        "assert",
        "docstring-missing-returns",
        "implicit-namespace-package",
        "import-private-name",
        "magic-value-comparison",
        "no-self-use",
        "private-member-access",
      ]

    [tool.ruff.lint.flake8-import-conventions]
      # ruff 0.17 bans gpd in preview although it lists it as the convention for geopandas
      banned-aliases = {}

    [tool.ruff.lint.flake8-import-conventions.extend-aliases]
      "collections.abc"  = "cabc"
      "datetime"         = "dt"
      "geopandas"        = "gpd"
      "numpy"            = "np"
      "numpy.typing"     = "npt"
      "rasterio"         = "rio"
      "shapely.geometry" = "shg"
      "typing"           = "t"
      "zoneinfo"         = "zi"

[tool.commitizen]
  name          = "cz_conventional_commits"
  tag_format    = "$version"
  version       = "1.1.0"
  version_files = ["pyproject.toml:version", "src/pstm/__version__.py:VERSION"]

[tool.pyrefly]
  preset           = "default"
  project-includes = ["src", "tests"]
  search-path      = ["src"]

  [tool.pyrefly.errors]
    implicit-any-parameter = "error"
    no-any-return          = "error"
    redundant-cast         = "warn"
    unannotated-return     = "error"

[tool.deptry]
  known_first_party = ["pstm"]

  [tool.deptry.per_rule_ignores]
    # the extra all refers to the other extras of the package itself; pandas reads
    # and writes feather and parquet through pyarrow and XML through lxml
    DEP002 = ["lxml", "pyarrow", "pyramecium-technology-models"]

[tool.pytest.ini_options]
  addopts      = "--maxfail=1 -n auto --dist=loadfile --strict-markers"
  python_files = "test_*.py"
  testpaths    = ["tests"]

[tool.coverage.run]
  branch = true
  omit   = ["__pypackages__/*", "build/*", "tests/*"]
  source = ["src/pstm"]

[tool.coverage.report]
  exclude_also = [
    '@(abc\.)?abstractmethod',
    'class .*\bProtocol\):',
    'def __repr__',
    'if __name__ == .__main__.:',
    'if t.TYPE_CHECKING:',
    'if TYPE_CHECKING:',
    'raise AssertionError',
    'raise NotImplementedError',
  ]
  show_missing = true

[tool.coverage.xml]
  output = "coverage.xml"

[tool.pyright]
  exclude          = ["**/__pycache__"]
  typeCheckingMode = "off"

[tool.poe.tasks]
  check = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "deptry ." },
    { cmd = "pyrefly check" },
  ]
  format = [{ cmd = "ruff check . --fix" }, { cmd = "ruff format ." }]
  lint = { cmd = "ruff check . --fix" }
  test = [{ ref = "check" }, { cmd = "pytest" }]

[tool.uv]
  prerelease = "disallow"
