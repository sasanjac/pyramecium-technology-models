---
name: Check code

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to check out. Empty means the default ref of the triggering event,
          which for pull_request_target is the base branch, so callers on that
          event pass the head SHA of the pull request.
        type: string
        required: false
        default: ""

jobs:
  check-code:
    name: Check code
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --all-groups --frozen

      - name: Check code
        run: uv run ruff check .

      - name: Check code format
        run: uv run ruff format --check .

      - name: Dependency check using deptry
        run: uv run deptry .

      - name: Type check using pyrefly
        run: uv run pyrefly check --output-format full-text-with-github
